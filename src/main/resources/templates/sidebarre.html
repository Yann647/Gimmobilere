<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav class="sidebar-nav">
    <ul id="sidebarnav">

        <!-- Accueil : tous les utilisateurs -->
        <li class="sidebar-item">
            <a class="sidebar-link" th:href="@{/}">
                <i data-feather="home" class="feather-icon"></i>
                <span class="hide-menu">Accueil</span>
            </a>
        </li>

        <!-- Gestion : ADMIN et AGENT uniquement -->
        <li class="nav-small-cap"
            sec:authorize="hasAnyRole('ADMIN', 'AGENT')">
            <span class="hide-menu">Gestion</span>
        </li>

        <!-- Contrats : ADMIN et AGENT -->
        <li class="sidebar-item"
            sec:authorize="hasAnyRole('ADMIN', 'AGENT')">
            <a class="sidebar-link" th:href="@{/contrat/liste}">
                <i data-feather="file-text" class="feather-icon"></i>
                <span class="hide-menu">Contrats</span>
            </a>
        </li>

        <!-- Propriétés : CLIENT, AGENT et ADMIN -->
        <li class="sidebar-item"
            sec:authorize="hasAnyRole('CLIENT', 'AGENT', 'ADMIN')">
            <a class="sidebar-link" th:href="@{/propriete/liste}">
                <i data-feather="home" class="feather-icon"></i>
                <span class="hide-menu">Propriétés</span>
            </a>
        </li>

        <!-- Réservations : CLIENT, AGENT et ADMIN -->
        <li class="sidebar-item"
            sec:authorize="hasAnyRole('CLIENT', 'AGENT', 'ADMIN')">
            <a class="sidebar-link" th:href="@{/reservation/liste}">
                <i data-feather="calendar" class="feather-icon"></i>
                <span class="hide-menu">Réservations</span>
            </a>
        </li>

        <!-- Utilisateurs : ADMIN uniquement -->
        <li class="sidebar-item"
            sec:authorize="hasRole('ADMIN')">
            <a class="sidebar-link" th:href="@{/user/liste}">
                <i data-feather="users" class="feather-icon"></i>
                <span class="hide-menu">Utilisateurs</span>
            </a>
        </li>

        <!-- Déconnexion : utilisateurs connectés -->
        <li class="list-divider"
            sec:authorize="isAuthenticated()"></li>

        <li class="nav-small-cap"
            sec:authorize="isAuthenticated()">
            <span class="hide-menu">Extra</span>
        </li>

        <li class="sidebar-item"
            sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="sidebar-link"
                        style="border: none; background: none; width: 100%; text-align: left;">
                    <i data-feather="log-out" class="feather-icon"></i>
                    <span class="hide-menu">Déconnexion</span>
                </button>
            </form>
        </li>

    </ul>
</nav>

</html>
